<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif
}

body{
  background:linear-gradient(135deg,#0a0a0a,#111,#0a0a0a);
  color:#fff;
  min-height:100vh;
}

/* Header */
.header{
  padding:20px;
  font-size:24px;
  font-weight:900;
}

/* Card */
.card{
  background:rgba(255,255,255,0.05);
  margin:15px;
  padding:25px;
  border-radius:25px;
  backdrop-filter:blur(15px);
  box-shadow:0 0 25px rgba(0,255,136,0.1);
  animation:fadeUp .5s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* Inputs */
.input{
  width:100%;
  padding:12px;
  margin-top:10px;
  margin-bottom:10px;
  border:none;
  border-radius:12px;
  background:#1a1a1a;
  color:#fff;
  outline:none;
  transition:.3s;
}

.input:focus{
  box-shadow:0 0 10px #00ff88;
}

/* Switch */
.switch{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:15px;
  padding:10px;
  background:#1a1a1a;
  border-radius:12px;
}

/* Button */
.btn{
  margin-top:20px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:15px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.save{
  background:linear-gradient(45deg,#00ff88,#00ccff);
  color:#000;
}

.save:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ff88;
}

/* Nav */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(15px);
  display:flex;
  justify-content:space-around;
  padding:15px;
  border-top:1px solid rgba(255,255,255,0.1);
}

.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:700;
  transition:.3s;
}

.nav a.active{
  color:#00ff88;
}

.nav a:hover{
  color:#00ff88;
}
</style>
</head>

<body>

<div class="header">⚙️ الإعدادات</div>

<div class="card">
  <label>الاسم</label>
  <input class="input" type="text" placeholder="اكتب اسمك">

  <label>البريد</label>
  <input class="input" type="email" placeholder="example@gmail.com">

  <div class="switch">
    <span>الوضع الداكن</span>
    <input type="checkbox" checked>
  </div>

  <button class="btn save" onclick="saveSettings()">حفظ التغييرات</button>
</div>

<div class="nav">
  <a href="index.html">Home</a>
  <a class="active" href="settings.html">Settings</a>
</div>

<script>
function saveSettings(){
  alert("تم حفظ الإعدادات ✅");
}
</script>

</body>
</html>
