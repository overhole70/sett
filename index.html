<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif
}

body{
  background:linear-gradient(135deg,#0a0a0a,#111,#0a0a0a);
  color:#fff;
  min-height:100vh;
}

/* Header */
.header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
}

/* Notification Button */
.notify{
  background:linear-gradient(45deg,#00ff88,#00ccff);
  color:#000;
  border:none;
  padding:10px 15px;
  border-radius:15px;
  cursor:pointer;
  font-weight:700;
  transition:.3s;
  box-shadow:0 0 10px #00ff88;
}

.notify:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #00ff88;
}

/* Profile */
.profile{
  background:rgba(255,255,255,0.05);
  margin:15px;
  padding:25px;
  border-radius:25px;
  text-align:center;
  backdrop-filter:blur(15px);
}

.avatar{
  width:100px;height:100px;
  border-radius:50%;
  background:url('https://i.pravatar.cc/200') center/cover;
  margin:auto;
  box-shadow:0 0 25px #00ff88;
}

.name{
  margin-top:12px;
  font-weight:900;
  font-size:22px;
}

.username{
  color:#00ff88;
  opacity:.8;
}

/* Button */
.btn{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:linear-gradient(45deg,#00ff88,#00ccff);
  color:#000;
}

/* Posts */
.posts{
  margin:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:18px;
  border-radius:20px;
  margin-bottom:12px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px) scale(1.02);
  box-shadow:0 0 20px rgba(0,255,136,0.2);
}

/* Nav */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(17,17,17,0.9);
  display:flex;
  justify-content:space-around;
  padding:15px;
}

.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:700;
}

.nav a.active{
  color:#00ff88;
}
</style>
</head>

<body>

<div class="header">
  <span>🏠 الصفحة الرئيسية</span>
  <button class="notify" onclick="sendNotification()">🔔 إشعار</button>
</div>

<div class="profile">
  <div class="avatar"></div>
  <div class="name">Over Hole</div>
  <div class="username">@overhole</div>
  <button class="btn primary">متابعة</button>
</div>

<div class="posts">
  <div class="card">🔥 مشروع GTA</div>
  <div class="card">⚡ FPS Boost</div>
  <div class="card">🎮 PUBG Mod</div>
</div>

<div class="nav">
  <a class="active" href="home.html">Home</a>
  <a href="settings.html">Settings</a>
</div>

<script>
async function sendNotification(){

  if (!("Notification" in window)) {
    alert("❌ المتصفح لا يدعم الإشعارات");
    return;
  }

  let permission = Notification.permission;

  if (permission === "default") {
    permission = await Notification.requestPermission();
  }

  if (permission !== "granted") {
    alert("❌ لازم تسمح بالإشعارات أول");
    return;
  }

  const notification = new Notification("🔥 إشعار جديد", {
    body: "هذا إشعار حقيقي من الموقع 🚀",
    icon: "https://cdn-icons-png.flaticon.com/512/1827/1827392.png",
    badge: "https://cdn-icons-png.flaticon.com/512/1827/1827392.png",
    vibrate: [200,100,200],
    tag: "overhole-notification"
  });

  notification.onclick = () => {
    window.focus();
    alert("👀 ضغطت على الإشعار");
  };
}
</script>

</body>
</html>
