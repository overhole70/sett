<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif
}

body{
  background:linear-gradient(135deg,#0a0a0a,#111,#0a0a0a);
  color:#fff;
  min-height:100vh;
}

/* Header */
.header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
  backdrop-filter:blur(10px);
}

/* Notification Button */
.notify{
  background:linear-gradient(45deg,#00ff88,#00ccff);
  color:#000;
  border:none;
  padding:10px 15px;
  border-radius:15px;
  cursor:pointer;
  font-weight:700;
  transition:.3s;
  box-shadow:0 0 10px #00ff88;
}

.notify:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #00ff88;
}

/* Profile */
.profile{
  background:rgba(255,255,255,0.05);
  margin:15px;
  padding:25px;
  border-radius:25px;
  text-align:center;
  backdrop-filter:blur(15px);
  box-shadow:0 0 25px rgba(0,255,136,0.1);
  animation:fadeUp .6s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.avatar{
  width:100px;height:100px;
  border-radius:50%;
  background:url('https://i.pravatar.cc/200') center/cover;
  margin:auto;
  box-shadow:0 0 25px #00ff88;
  border:3px solid #00ff88;
}

.name{
  margin-top:12px;
  font-weight:900;
  font-size:22px;
}

.username{
  color:#00ff88;
  opacity:.8;
}

/* Button */
.btn{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:15px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.primary{
  background:linear-gradient(45deg,#00ff88,#00ccff);
  color:#000;
}

.primary:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ff88;
}

/* Posts */
.posts{
  margin:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:18px;
  border-radius:20px;
  margin-bottom:12px;
  backdrop-filter:blur(10px);
  transition:.3s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(45deg,transparent,#00ff8844,transparent);
  top:0;
  left:-100%;
  transition:.4s;
}

.card:hover::before{
  left:100%;
}

.card:hover{
  transform:translateY(-5px) scale(1.02);
  box-shadow:0 0 20px rgba(0,255,136,0.2);
}

/* Nav */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(15px);
  display:flex;
  justify-content:space-around;
  padding:15px;
  border-top:1px solid rgba(255,255,255,0.1);
}

.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:700;
  transition:.3s;
  position:relative;
}

.nav a.active{
  color:#00ff88;
}

.nav a.active::after{
  content:"";
  position:absolute;
  width:100%;
  height:3px;
  background:#00ff88;
  bottom:-6px;
  left:0;
  border-radius:10px;
}

.nav a:hover{
  color:#00ff88;
}
</style>
</head>

<body>

<div class="header">
  <span>🏠 الصفحة الرئيسية</span>
  <button class="notify" onclick="sendNotification()">🔔 إشعار</button>
</div>

<div class="profile">
  <div class="avatar"></div>
  <div class="name">Over Hole</div>
  <div class="username">@overhole</div>
  <button class="btn primary">متابعة</button>
</div>

<div class="posts">
  <div class="card">🔥 مشروع GTA</div>
  <div class="card">⚡ FPS Boost</div>
  <div class="card">🎮 PUBG Mod</div>
</div>

<div class="nav">
  <a class="active" href="home.html">Home</a>
  <a href="settings.html">Settings</a>
</div>

<script>
function sendNotification(){
  if (!("Notification" in window)) {
    alert("المتصفح لا يدعم الإشعارات");
    return;
  }

  if (Notification.permission === "granted") {
    new Notification("🔥 إشعار جديد", {
      body: "تم الضغط على زر الإشعار!",
      icon: "https://cdn-icons-png.flaticon.com/512/1827/1827392.png"
    });
  } 
  else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        new Notification("🔥 إشعار جديد", {
          body: "تم تفعيل الإشعارات!",
        });
      }
    });
  } else {
    alert("تم رفض الإشعارات ❌");
  }
}
</script>

</body>
</html>
