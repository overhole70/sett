<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}

body{
  background:#0a0a0a;
  color:#fff;
}

.header{
  padding:20px;
  font-size:22px;
  font-weight:900;
}

/* Card */
.card{
  background:#111;
  margin:15px;
  padding:20px;
  border-radius:20px;
}

/* Inputs */
.input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#222;
  color:#fff;
}

/* Switch */
.switch{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

.btn{
  margin-top:15px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:15px;
  font-weight:700;
  cursor:pointer;
}

.save{
  background:#00ff88;
  color:#000;
}

/* Nav */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:15px;
  border-top:1px solid #222;
}

.nav a{
  color:#aaa;
  text-decoration:none;
  font-weight:700;
}
.nav a.active{color:#00ff88}
</style>
</head>

<body>

<div class="header">⚙️ الإعدادات</div>

<div class="card">
  <label>الاسم</label>
  <input class="input" type="text" placeholder="اكتب اسمك">

  <label>البريد</label>
  <input class="input" type="email" placeholder="example@gmail.com">

  <div class="switch">
    <span>الوضع الداكن</span>
    <input type="checkbox" checked>
  </div>

  <button class="btn save" onclick="alert('تم الحفظ ✅')">حفظ التغييرات</button>
</div>

<div class="nav">
  <a href="index.html">Home</a>
  <a class="active" href="settings.html">Settings</a>
</div>

</body>
</html>
